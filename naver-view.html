<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이버 로드뷰</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; }
      body { display: grid; grid-template-rows: auto minmax(0, 1fr); color: #18352b; background: #edf2ef; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #d6e0da; background: #fff; }
      header div { display: grid; gap: 3px; min-width: 0; }
      strong { font-size: 16px; }
      #status { overflow: hidden; color: #66766f; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      a { flex: 0 0 auto; border: 1px solid #b7d8c9; border-radius: 8px; padding: 8px 12px; color: #176b4c; background: #eaf5ef; font-size: 13px; font-weight: 800; text-decoration: none; }
      #viewerWrap { position: relative; isolation: isolate; contain: paint; min-width: 0; min-height: 0; overflow: hidden; background: #dfe7e2; }
      #viewer { position: absolute; inset: 0; z-index: 0; min-width: 0; min-height: 0; background: #dfe7e2; }
      #zoomControls { position: absolute; top: 12px; left: 12px; z-index: 2147483647; display: grid; gap: 5px; opacity: 1 !important; visibility: visible !important; pointer-events: auto; transform: translateZ(0); backface-visibility: hidden; }
      #zoomControls button { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid #cbd7d1; border-radius: 8px; color: #33463f; background: rgba(255, 255, 255, 0.96); box-shadow: 0 2px 8px rgba(20, 47, 37, 0.15); font: 700 22px/1 Arial, sans-serif; cursor: pointer; }
      #zoomControls button:active { background: #e8f2ed; }
      #error { display: grid; place-items: center; height: 100%; padding: 24px; color: #b34137; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong id="title">네이버 로드뷰</strong>
        <span id="status">사진 위치 주변의 로드뷰를 불러오는 중입니다.</span>
      </div>
      <a id="mapLink" href="#">네이버 지도보기</a>
    </header>
    <div id="viewerWrap">
      <main id="viewer" aria-label="네이버 로드뷰"></main>
      <div id="zoomControls" aria-label="로드뷰 확대 축소" hidden>
        <button id="zoomInBtn" type="button" aria-label="확대">+</button>
        <button id="zoomOutBtn" type="button" aria-label="축소">−</button>
      </div>
    </div>
    <script src="/naver-view.js?v=20260811-roadview-controls-layer-1"></script>
  </body>
</html>
